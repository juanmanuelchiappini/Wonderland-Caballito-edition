<script>
'use strict';
// ============ BASE ============
const cv=document.getElementById('c'),MAIN=cv.getContext('2d');
const VW=640,VH=360,T=20,ROWS=18,LW=240,GY=300;
// Escala de dibujo: el juego piensa en 640x360 pero dibuja al doble (PC) para que las imágenes se vean nítidas.
const RS=((('ontouchstart' in window)||navigator.maxTouchPoints>0)&&Math.min(screen.width,screen.height)<700)?1.5:2;
cv.width=Math.round(VW*RS);cv.height=Math.round(VH*RS);
// Las imágenes vienen al doble de resolución: se usan con su tamaño "lógico" y se dibujan con todo su detalle.
const IMGS=2;
const _di=CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.drawImage=function(im,...a){const s=im&&im._s;if(!s)return _di.call(this,im,...a);
  if(a.length===2)return _di.call(this,im,0,0,im._rw,im._rh,a[0],a[1],im.width,im.height);
  if(a.length===4)return _di.call(this,im,0,0,im._rw,im._rh,a[0],a[1],a[2],a[3]);
  return _di.call(this,im,a[0]*s,a[1]*s,a[2]*s,a[3]*s,a[4],a[5],a[6],a[7]);};
function hiFy(o,s,rw,rh){o._s=s;o._rw=rw;o._rh=rh;const lw=rw/s,lh=rh/s;Object.defineProperty(o,'width',{get:()=>lw,configurable:true});Object.defineProperty(o,'height',{get:()=>lh,configurable:true});return o;}
let X=MAIN;
const FONT="'Press Start 2P', monospace";
const touch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(touch)document.body.classList.add('touch');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
// lienzo de trabajo al doble (mismo tamaño lógico)
function mk2(w,h){const s=RS,c=document.createElement('canvas');c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);return hiFy(c,s,c.width,c.height);}
function withCtx(c,fn){const p=X;X=c.getContext('2d');if(c._s)X.setTransform(c._s,0,0,c._s,0,0);X.imageSmoothingEnabled=false;fn();X=p;}

function layout(){
  const w=innerWidth,h=innerHeight,portrait=h>w;
  const availH=(touch&&portrait)?h-250:h;
  const s=Math.min(w/VW,availH/VH);
  cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
  cv.style.marginTop=Math.floor((touch&&portrait)?Math.max(10,(availH-VH*s)/2):(h-VH*s)/2)+'px';
}
addEventListener('resize',layout);layout();

// ============ INPUT ============
const K={l:0,r:0,u:0,d:0,a:0,b:0,c:0},PK={l:0,r:0,u:0,d:0,a:0,b:0,c:0},JP={};
let tap=false;
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',KeyZ:'a',Space:'a',KeyK:'a',Enter:'a',KeyX:'b',KeyJ:'b',KeyC:'c',KeyL:'c'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){if(!K[k]&&!e.repeat)JP[k]=1;K[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){K[k]=0;e.preventDefault();}});
document.querySelectorAll('#ctl .b').forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault();if(typeof seqPush==='function')seqPush(k);if(!K[k])JP[k]=1;K[k]=1;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{K[k]=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
});
cv.addEventListener('pointerdown',()=>{tap=true;});
addEventListener('contextmenu',e=>e.preventDefault());
function hit(k){return !!JP[k]||(K[k]&&!PK[k]);}
function adv(){return hit('a')||hit('b')||tap;}

// ============ PIXEL HELPERS ============
const OL='#1b1526',SKIN='#f2c29a',SKINS='#d4957a',LIMB='#2e2742',PAP='#f4efe2',PAPS='#d9cfbb',RED='#d8283a',CREAM='#f4efe2';
const BC=['#c8343c','#3a64b0','#3a8a4a','#e0b040','#8a4aa0','#e07a30'];
function P(x,y,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),1,1);}
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function disc(cx,cy,rx,ry,c){cx=Math.round(cx);cy=Math.round(cy);ry=Math.max(1,Math.round(ry));for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));R(cx-w,cy+y,2*w+1,1,c);}}
function hdisc(cx,cy,r,c){for(let y=-r;y<=0;y++){const w=Math.round(Math.sqrt(r*r-y*y));R(cx-w,cy+y,2*w+1,1,c);}}
function dith(x,y,w,h,c,par){X.fillStyle=c;for(let j=0;j<h;j++)for(let i=(j+(par||0))%2;i<w;i+=2)X.fillRect(x+i,y+j,1,1);}
function dith25(x,y,w,h,c){X.fillStyle=c;for(let j=0;j<h;j+=2)for(let i=((j>>1)%2);i<w;i+=2)X.fillRect(x+i,y+j,1,1);}
function ddisc(cx,cy,r,c){X.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));for(let x=-w;x<=w;x++)if(((x+y)%2+2)%2===0)X.fillRect(cx+x,cy+y,1,1);}}
function ring(x,y,w,h,c){R(x,y,w,1,c);R(x,y+h-1,w,1,c);R(x,y,1,h,c);R(x+w-1,y,1,h,c);}
function hs(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function pmap(rows,x,y,cols){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=cols[r[i]];if(c)P(x+i,y+j,c);}});}
function txt(s,x,y,c,sh,sz,al){X.font=(sz||16)+'px '+FONT;X.textBaseline='top';X.textAlign=al||'left';if(sh){X.fillStyle=sh;X.fillText(s,x+2,y+2);}X.fillStyle=c;X.fillText(s,x,y);}
function tline(x0,y0,x1,y1,w,c){const n=Math.ceil(Math.hypot(x1-x0,y1-y0));for(let i=0;i<=n;i++){const t=i/n;R(x0+(x1-x0)*t-w/2,y0+(y1-y0)*t-w/2,w,w,c);}}
function wrap(s,n){const out=[];let cur='';for(const w of s.split(' ')){if(!cur)cur=w;else if((cur+' '+w).length<=n)cur+=' '+w;else{out.push(cur);cur=w;}}if(cur)out.push(cur);return out;}

const IMG_SRC={fondo:'img/fondo1.jpg',dos:'img/dos.png',siete:'img/siete.png',florista:'img/florista.png',gato:'img/gato.png',fondo2:'img/fondo2.jpg',madriguera:'img/madriguera.jpg',telescopio:'img/telescopio.jpg',esqueletos:'img/esqueletos.jpg',frasco:'img/frasco.png',carta:'img/carta.png',gatosentado:'img/gatosentado.png',erizo:'img/erizo.png',pinta2:'img/pinta2.png',pinta5:'img/pinta5.png',pinta7:'img/pinta7.png',cincop:'img/cincop.png',caida2:'img/caida2.png',caida5:'img/caida5.png',caida7:'img/caida7.png',peon:'img/peon.png',reina2:'img/reina2.png',rey:'img/rey.png',nene:'img/nene.png',puestero:'img/puestero.png',oruga:'img/oruga.png',bib:'img/bib.png',perro:'img/perro.png',perrod:'img/perrod.png',libros3:'img/libros3.png',libro1:'img/libro1.png',escalera:'img/escalera.png',pila:'img/pila.png',retratos:'img/retratos.png',jardin:'img/jardin.jpg',jardinrojo:'img/jardinrojo.jpg',jardinnoche:'img/jardinnoche.jpg',libro:'img/libro.jpg',rosal:'img/rosal.png',fondo3:'img/fondo3.jpg',fondo4:'img/fondo4.jpg',conejor:'img/conejor.png',conejow:'img/conejow.png',conejof:'img/conejof.png',gatow:'img/gatow.png',mesita:'img/mesita.png',mecedora:'img/mecedora.png',espejo:'img/espejo.png',librosf:'img/librosf.png',florerof:'img/florerof.png',siete_arr:'img/siete_arr.png',vallado:'img/vallado.png',estante:'img/estante.png',platano:'img/platano.png',nener:'img/nener.png',madriguerav:'img/madriguerav.jpg',titulo:'img/titulo.jpg'};
const IMG={};
// Sprites generados con Gemini: tiras horizontales, cuadros del mismo ancho, mirando a la derecha
const SPR={2:{k:'dos',n:3,walk:[1,0,2,0],air:1},5:{k:'cincop',n:5,walk:[2,3,4,3],air:3},7:{k:'siete',n:4,walk:[1,2,3,2],air:3}};
function sprFrame(n,i){const s=SPR[n],im=IMG[s.k],fw=im.width/s.n;return {im,sx:i*fw,fw,fh:im.height};}
function okI(k){return IMG[k]&&IMG[k].naturalWidth>0;}
// Cantidad de cuadros de cada tira de sprites (todas miran a la derecha)
const STRIPN={conejor:4,conejow:2,conejof:2,gatow:5,nener:7,pinta2:3,pinta5:3,pinta7:3,cincop:5,caida2:2,caida5:2,caida7:2,peon:8,reina2:7,rey:7,nene:7,puestero:4,oruga:4,bib:7,perro:8,perrod:2,gatosentado:3,erizo:4,gato:3};
// Puntos de referencia dentro de los fondos (en pixeles de la capa media)
const BG3={feria:600,ombu:1590,veleta:2660},BG4={mesas:1230,fichero:1612,cartel:[2468,45,80,111]};
// Retratos de dialogo: orden dentro de img/retratos.png (cuadros de 72x72)
const PIDX={maryann:12,2:0,5:1,7:2,florista:3,reina:4,gato:5,peon:6,nene:7,puestero:8,oruga:9,bib:10,rey:11};
// Dibuja el cuadro i de una tira, centrado en cx, con los pies en by; face<0 lo da vuelta
function drawFr(src,i,cx,by,face,alpha,n){
  if(typeof src==='string'){n=n||STRIPN[src];src=IMG[src];}
  if(!src||!src.width)return;const fw=src.width/n,fh=src.height;
  X.save();if(alpha!=null)X.globalAlpha=alpha;
  if(face<0){X.translate(Math.round(cx)*2,0);X.scale(-1,1);}
  X.drawImage(src,i*fw,0,fw,fh,Math.round(cx-fw/2),Math.round(by-fh),fw,fh);X.restore();
}
// Version teñida de rojo de una imagen (para lo que ya se pintó)
const TINT={};
function tinted(k){if(TINT[k])return TINT[k];const im=IMG[k];const c=mk2(im.width,im.height);
  withCtx(c,()=>{X.drawImage(im,0,0);});
  try{const ctx=c.getContext('2d'),id=ctx.getImageData(0,0,c._rw,c._rh),d=id.data;
    for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const L=(0.3*d[i]+0.59*d[i+1]+0.11*d[i+2])/255;
      if(L<0.16){d[i]=Math.round(40+L*200);d[i+1]=8;d[i+2]=18;continue;}   // contornos: rojo muy oscuro
      d[i]=Math.round(70+185*Math.min(1,L*1.15));d[i+1]=Math.round(14+70*L*L);d[i+2]=Math.round(26+60*L*L);}
    ctx.putImageData(id,0,0);}
  catch(e){withCtx(c,()=>{X.globalCompositeOperation='source-atop';X.fillStyle='rgba(216,40,58,0.85)';X.fillRect(0,0,c.width,c.height);X.globalCompositeOperation='source-over';});}
  return TINT[k]=c;}
function portrait(key,x,y,sz){if(!okI('retratos')||PIDX[key]==null)return false;X.drawImage(IMG.retratos,PIDX[key]*72,0,72,72,x,y,sz,sz);return true;}
function speaking(sp){return dlg&&dlg.pages[dlg.i]&&dlg.pages[dlg.i].sp===sp;}

function loadImages(){return Promise.all(Object.entries(IMG_SRC).map(([k,src])=>new Promise(r=>{const im=new Image();im.onload=()=>{hiFy(im,IMGS,im.naturalWidth,im.naturalHeight);IMG[k]=im;r();};im.onerror=()=>{IMG[k]=im;r();};im.src=src;})));}
// ============ ESCENARIO: FONDO LEJANO ============
const FAR_F=0.15;let MID_F=0.5;
const farC=mk(Math.ceil(VW+(LW*T-VW)*FAR_F)+4,VH);
let midC=mk(Math.ceil(VW+(LW*T-VW)*MID_F)+4,272);
const worldC=mk2(LW*T,VH);
const lightC=mk(VW,VH);
const busC=mk(216,72);

function cloud(cx,cy,len){
  const n=Math.max(3,Math.round(len/9)),pts=[];
  for(let k=0;k<n;k++){const x=cx-len/2+k*len/(n-1);const r=6+hs(cx+k*7)*7*(1-Math.abs(k/(n-1)-.5));pts.push([x,r]);}
  pts.forEach(([x,r])=>disc(x,cy+3,r+2,(r+2)*.5,'#6e4a86'));
  pts.forEach(([x,r])=>disc(x,cy,r,r*.6,'#b5678f'));
  pts.forEach(([x,r])=>disc(x+2,cy-2,Math.max(1,r-2),Math.max(1,(r-2)*.5),'#e8939a'));
  pts.forEach(([x,r])=>{if(r>8)disc(x+3,cy-4,r-6,Math.max(1,(r-6)*.4),'#ffc9a0');});
}
function buildFar(){
  const W=farC.width;
  const cs=['#272552','#302d66','#3d3577','#4f3d86','#66448f','#804c93','#9d5590','#ba6189','#d4737f','#e68c7a','#f0a77a','#f6c286'],bh=18;
  cs.forEach((c,i)=>{R(0,i*bh,W,bh,c);if(i<cs.length-1){dith25(0,i*bh+bh-8,W,4,cs[i+1]);dith(0,i*bh+bh-4,W,4,cs[i+1]);}});
  R(0,cs.length*bh,W,VH,cs[cs.length-1]);
  ddisc(566,176,40,'#f6b880');ddisc(566,176,28,'#ffd29a');disc(566,176,15,15,'#ffe3a6');disc(566,176,12,12,'#fff4d4');
  for(let k=0;k*170<W+170;k++)cloud(60+k*170+hs(k)*60,24+hs(k+3)*55,60+hs(k+5)*100);
  const n=Math.round(W/32);
  for(let i=0;i<n;i++){const x=Math.round(hs(i)*W),w=Math.round(22+hs(i+9)*20),h=Math.round(70+hs(i+19)*95);
    R(x,216-h,w,h,'#4a3d77');R(x+w-3,216-h,3,h,'#6b5590');R(x,216-h,w,1,'#7d64a0');
    for(let wy=216-h+4;wy<210;wy+=6)for(let wx=x+3;wx<x+w-4;wx+=5)if(hs(wx*3+wy*7)>0.8)R(wx,wy,2,2,'#f4b36e');
    if(hs(i+40)>0.6){R(x+w/2,216-h-10,1,10,'#4a3d77');P(x+w/2,216-h-11,'#ff6a5a');}}
  dith(0,150,W,70,'#8f6299',0);
}

// ============ FACHADAS (CAPA MEDIA) ============
const ST=[
{w:'#e3cc9e',s:'#c4a878',l:'#f6e2b6',t:'#efe0bf',tl:'#fff4dc',sh:'#3d5d48',g:'#cdb68a',a1:'#2f6e4a',a2:'#efe6d0',balc:1},
{w:'#b2583a',s:'#8c3f26',l:'#cc7454',t:'#e6d6b4',tl:'#fff0d4',sh:'#2a3a4a',g:'#9a4a32',a1:'#c23a3a',a2:'#f0e6d0',brick:1},
{w:'#98ab88',s:'#7a8c6c',l:'#b6c8a0',t:'#e8e2cc',tl:'#fffbe8',sh:'#5a3a2a',g:'#86997a',a1:'#3a4a8a',a2:'#efe6d0',mans:1},
{w:'#da9478',s:'#b87458',l:'#f2ae90',t:'#f2e4cc',tl:'#fff6e4',sh:'#3a5a6a',g:'#c08066',a1:'#e0a030',a2:'#5a3020',balc:1},
{w:'#d9d2c0',s:'#b6ad98',l:'#efe8d6',t:'#f4eedd',tl:'#ffffff',sh:'#6a2a30',g:'#bdb39c',a1:'#8a2a3a',a2:'#efe6d0'}];
function windowEl(wx,wy,st,lit,balc){
  R(wx-3,wy-5,18,3,st.t);R(wx-3,wy-5,18,1,st.tl);R(wx-3,wy-2,18,1,'#00000040');
  for(const sx of [wx-6,wx+13]){R(sx,wy,5,21,OL);R(sx+1,wy+1,3,19,st.sh);for(let k=wy+2;k<wy+20;k+=2)R(sx+1,k,3,1,'#00000033');}
  R(wx-1,wy-1,14,23,OL);
  if(lit){R(wx,wy,12,21,'#e8a052');R(wx+1,wy+1,10,8,'#ffd58a');R(wx+1,wy+12,4,8,'#f6be6a');}
  else{R(wx,wy,12,21,'#3a4064');for(let k=0;k<7;k++)P(wx+2+k,wy+11-k,'#8a7ab4');R(wx+1,wy+1,10,1,'#55608a');}
  R(wx+5,wy,2,21,OL);R(wx,wy+9,12,1,OL);
  if(balc){R(wx-6,wy+21,24,3,st.t);R(wx-6,wy+21,24,1,st.tl);R(wx-6,wy+24,24,2,'#00000044');R(wx-6,wy+12,24,1,OL);for(let k=wx-6;k<wx+18;k+=2)R(k,wy+13,1,8,OL);}
  else{R(wx-2,wy+21,16,2,st.t);R(wx-2,wy+23,16,1,'#00000040');}
}
function facade(x,w,nF,st){
  const base=216,gf=38,top=base-gf-nF*32-6;
  R(x,top,w,base-top,st.w);
  if(st.brick){for(let y=top+3;y<base-gf;y+=4){R(x,y,w,1,st.s);const o=(((y-top)/4|0)%2)?0:5;for(let bx=x+o;bx<x+w;bx+=10)R(bx,y-3,1,3,st.s);}}
  else for(let k=0;k<w*(base-top)/30;k++)P(x+hs(k+x)*w,top+hs(k*3+x+1)*(base-top),st.s);
  R(x,top,2,base-top,st.s);R(x+w-2,top,2,base-top,st.l);
  const nW=Math.max(1,Math.floor((w-6)/30)),sp=w/nW;
  for(let f=0;f<nF;f++){const fy=base-gf-(nF-f)*32;
    for(let i=0;i<nW;i++){const wx=Math.round(x+sp*i+(sp-12)/2);windowEl(wx,fy+7,st,hs(x+i*7+f*13)>0.62,st.balc&&f%2===0);}
    R(x,fy+30,w,2,st.t);R(x,fy+30,w,1,st.tl);R(x,fy+32,w,1,'#00000038');}
  R(x-3,top-6,w+6,7,OL);R(x-2,top-5,w+4,5,st.t);R(x-2,top-5,w+4,1,st.tl);for(let k=x;k<x+w;k+=4)R(k,top-1,2,2,st.s);R(x,top+1,w,2,'#00000044');
  if(st.mans){for(let j=0;j<20;j++){const ins=Math.round((20-j)*0.8);R(x+ins,top-26+j,w-2*ins,1,j%4===0?'#3f425e':'#555a7c');}

function tone(f,t,dur,wave,vol,out,attack){
  if(!f)return;const o=AC.createOscillator(),g=AC.createGain();
  if(wave==='box'||wave==='bell'){o.type='sine';const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sine';o2.frequency.value=f*(wave==='bell'?2.76:2);g2.gain.value=0.25;o2.connect(g2);g2.connect(g);o2.start(t);o2.stop(t+dur*2.5);}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(attack||0.008));g.gain.exponentialRampToValueAtTime(0.0008,t+dec);

function schedule(){
  if(!AC||!curSong||AC.state!=='running')return;const sg=SONGS[curSong];if(!sg)return;
  const mel=sg._m||(sg._m=sg.mel.split(/\s+/)),chs=sg._c||(sg._c=sg.ch.split(/\s+/)),spb=60/sg.bpm/2,len=mel.length;
  if(nextT<AC.currentTime-0.2)nextT=AC.currentTime+0.05;
  while(nextT<AC.currentTime+0.12){
    const i=step%len,bi=Math.floor(i/sg.bar),bs=i%sg.bar,tk=mel[i];
    if(tk!=='.'&&tk!=='-'){let n=1;while(mel[(i+n)%len]==='-'&&n<16)n++;const out=sg.echo?echoIn:MG;tone(nfreq(tk),nextT,spb*n*0.95,sg.mw,sg.mv,MG);if(sg.echo)tone(nfreq(tk),nextT,spb*n*0.9,sg.mw,sg.mv*0.5,out);}

    case 'card':drawCard();break;
    case 'level':drawScene(true);X.drawImage(lightC,0,0);grade(false);drawHUD();if(dlg)drawDlg();break;
    case 'tally':drawTally();break;
    case 'next':drawNext();break;
    case 'final':drawFinal();break;
    case 'fin':drawFin();break;
  }
  if(fadeTo){X.fillStyle='rgba(8,4,16,'+(fadeT<30?fadeT/30:(60-fadeT)/30)+')';X.fillRect(0,0,VW,VH);}
  if(toastT>0){toastT--;R(170,320,300,24,'rgba(18,14,34,0.85)');ring(170,320,300,24,'#f4efe2');txt(toastS,320,328,'#f4efe2',null,8,'center');}
  drawMuteIcon();
}
function init(){
  withCtx(farC,buildFar);withCtx(busC,buildBus);withCtx(lightC,buildLight);withCtx(jardinC,buildJardin);
  loadLevel(1);
}
let last=0,acc=0;
function loop(now){if(!last)last=now;acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60;}draw();requestAnimationFrame(loop);}
function boot(){loadImages().then(()=>{init();requestAnimationFrame(loop);});}
if(document.fonts&&document.fonts.load)Promise.race([document.fonts.load("16px 'Press Start 2P'"),new Promise(r=>setTimeout(r,2000))]).then(boot,boot);else boot();
</script>
